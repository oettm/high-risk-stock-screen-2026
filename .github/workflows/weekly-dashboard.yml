name: Weekly portfolio dashboard refresh

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard generator
        run: python dashboard_main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.html data/dashboard_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly dashboard refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
